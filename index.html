<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OutReach KPI — Quarter Goal</title>
<style>
  :root {
    --bg-0:#0b0d12; --bg-1:#11141c;
    --card:rgba(255,255,255,0.035); --card-border:rgba(255,255,255,0.08);
    --text-primary:#f5f7fa; --text-secondary:#8b93a7; --text-tertiary:#565e70;
    --track:rgba(255,255,255,0.07);
    --status:#f5a623; --status-soft:rgba(245,166,35,0.14); --status-glow:rgba(245,166,35,0.35);
    --radius-lg:30px; --radius-pill:999px;
    --font-stack:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; min-width:0; }
  html,body { height:100%; background:var(--bg-0); font-family:var(--font-stack); color:var(--text-primary); -webkit-font-smoothing:antialiased; overflow:hidden; }
  body::before { content:""; position:fixed; inset:0; background: radial-gradient(1200px 800px at 78% 12%, var(--status-soft), transparent 60%), radial-gradient(900px 700px at 12% 92%, rgba(90,120,255,0.06), transparent 60%), linear-gradient(180deg,var(--bg-1),var(--bg-0)); transition:background 1.2s ease; z-index:-1; }

  .stage { height:100vh; width:100vw; display:flex; padding:2.2vh 2.4vw; }
  .kpi-card { width:100%; background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius-lg); backdrop-filter:blur(24px); box-shadow:0 40px 80px -20px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.02); padding:clamp(26px,3.2vh,54px) clamp(34px,3.4vw,72px); display:flex; flex-direction:column; gap:clamp(18px,2.6vh,40px); overflow:hidden; animation:cardIn 0.9s cubic-bezier(0.22,1,0.36,1) both; }
  @keyframes cardIn { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:none;} }

  .card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; }
  .title-block .eyebrow { font-size:clamp(13px,1vw,18px); font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:10px; }
  .title-block h1 { font-size:clamp(34px,3vw,58px); font-weight:700; letter-spacing:-0.02em; }
  .chip-row { display:flex; gap:14px; align-items:center; flex-shrink:0; }
  .days-chip,.month-chip { display:flex; align-items:center; gap:12px; padding:12px 24px; border-radius:var(--radius-pill); background:rgba(255,255,255,0.05); border:1px solid var(--card-border); font-size:clamp(16px,1.3vw,24px); font-weight:600; color:var(--text-secondary); white-space:nowrap; }
  .days-chip .q-label { color:var(--text-tertiary); font-weight:500; }
  .countdown { display:flex; align-items:baseline; gap:12px; }
  .countdown .seg { display:flex; align-items:baseline; gap:4px; }
  .countdown .seg b { color:var(--text-primary); font-weight:700; font-size:clamp(18px,1.5vw,28px); font-variant-numeric:tabular-nums; min-width:2ch; text-align:right; }
  .countdown .seg span { color:var(--text-tertiary); font-size:clamp(12px,1vw,17px); font-weight:500; }
  .month-chip .dot { width:10px; height:10px; border-radius:50%; background:var(--status); box-shadow:0 0 12px var(--status-glow); transition:all 0.8s ease; }

  .figures { display:flex; align-items:flex-end; justify-content:space-between; gap:32px; }
  .amounts { display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  .amount-actual { font-size:clamp(64px,6vw,120px); font-weight:800; letter-spacing:-0.03em; line-height:1; font-variant-numeric:tabular-nums; }
  .amount-divider { font-size:clamp(38px,3vw,56px); font-weight:300; color:var(--text-tertiary); }
  .amount-target { font-size:clamp(38px,3vw,56px); font-weight:600; color:var(--text-secondary); letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  .amount-label,.pct-label { font-size:clamp(13px,1.05vw,20px); font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-tertiary); margin-top:14px; }
  .achievement { text-align:right; flex-shrink:0; }
  .achievement .pct { font-size:clamp(58px,5.2vw,104px); font-weight:800; letter-spacing:-0.03em; line-height:1; color:var(--status); font-variant-numeric:tabular-nums; transition:color 0.8s ease; text-shadow:0 0 60px var(--status-glow); }

  .progress-track { position:relative; height:clamp(22px,2.4vh,34px); background:var(--track); border-radius:var(--radius-pill); overflow:hidden; }
  .progress-fill { position:absolute; inset:0 auto 0 0; width:0%; border-radius:var(--radius-pill); background:linear-gradient(90deg, color-mix(in srgb, var(--status) 70%, #fff 8%), var(--status)); box-shadow:0 0 32px var(--status-glow); transition:width 1.6s cubic-bezier(0.22,1,0.36,1), background 0.8s ease, box-shadow 0.8s ease; }
  .progress-fill::after { content:""; position:absolute; inset:0; background:linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.28) 50%, transparent 70%); background-size:240px 100%; background-repeat:no-repeat; animation:sheen 3.5s ease-in-out infinite; }
  @keyframes sheen { 0%{background-position:-240px 0;} 55%,100%{background-position:calc(100% + 240px) 0;} }
  .bar-pct { position:absolute; top:50%; transform:translate(-110%,-50%); font-size:clamp(12px,1vw,18px); font-weight:700; color:#0b0d12; font-variant-numeric:tabular-nums; white-space:nowrap; transition:left 1.6s cubic-bezier(0.22,1,0.36,1), color 0.4s ease; pointer-events:none; z-index:2; }
  .bar-pct.outside { transform:translate(12px,-50%); color:var(--status); }
  .progress-meta { display:flex; justify-content:space-between; margin-top:16px; font-size:clamp(13px,1.05vw,20px); font-weight:500; color:var(--text-tertiary); font-variant-numeric:tabular-nums; }
  .progress-meta .remaining strong { color:var(--text-secondary); font-weight:600; }

  /* milestones + next-milestone */
  .milestones-wrap { display:flex; align-items:center; gap:clamp(14px,1.4vw,26px); flex-wrap:wrap; }
  .milestones { display:flex; align-items:center; gap:clamp(10px,1vw,16px); flex-wrap:wrap; min-height:1px; }
  .milestones-head { font-size:clamp(12px,0.95vw,18px); font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-tertiary); margin-right:4px; }
  .medal { display:inline-flex; align-items:center; gap:8px; padding:9px 16px 9px 11px; border-radius:999px; background:rgba(48,209,88,0.12); border:1px solid rgba(48,209,88,0.32); font-size:clamp(14px,1.1vw,20px); font-weight:700; color:#b8f5c8; font-variant-numeric:tabular-nums; white-space:nowrap; animation:medalPop 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
  .medal .medal-ico { width:clamp(20px,1.6vw,28px); height:auto; }
  @keyframes medalPop { from{opacity:0; transform:scale(0.6) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);} }

  /* NEXT milestone pill */
  .next-milestone { display:inline-flex; align-items:center; gap:10px; padding:9px 18px; border-radius:999px; border:1px dashed rgba(245,166,35,0.5); background:rgba(245,166,35,0.08); font-size:clamp(13px,1.05vw,19px); font-weight:700; color:#ffd591; white-space:nowrap; }
  .next-milestone .nm-target { color:#fff; }
  .next-milestone .nm-sub { color:var(--text-tertiary); font-weight:500; font-size:0.85em; }
  .next-milestone .nm-ring { position:relative; width:clamp(26px,2vw,34px); height:clamp(26px,2vw,34px); flex-shrink:0; }

  .pulse { animation:pulse 0.7s ease; }
  @keyframes pulse { 0%{transform:scale(1);} 35%{transform:scale(1.03);} 100%{transform:scale(1);} }

  /* finance rows */
  .fin-section { display:flex; flex-direction:column; gap:clamp(14px,1.8vh,26px); margin-top:auto; }
  .fin-row { display:flex; gap:clamp(14px,1.4vw,24px); }
  .stat-card { flex:1; display:flex; flex-direction:column; justify-content:center; background:rgba(255,255,255,0.04); border:1px solid var(--card-border); border-radius:20px; padding:clamp(18px,2.6vh,34px) clamp(18px,1.8vw,30px); }
  .stat-card .stat-label { font-size:clamp(12px,1vw,18px); font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:12px; }
  .stat-card .stat-value { font-size:clamp(28px,2.6vw,50px); font-weight:800; letter-spacing:-0.02em; color:var(--text-primary); font-variant-numeric:tabular-nums; line-height:1; }
  /* highlighted monthly cards on the top finance row */
  .stat-card.month-hi { background:rgba(87,61,255,0.10); border-color:rgba(130,157,255,0.4); }
  .stat-card.month-hi .stat-value { color:#c3cbff; }

  .confetti-piece { position:fixed; top:-20px; width:12px; height:16px; z-index:40; opacity:0; will-change:transform,opacity; }
  @keyframes confettiFall { 0%{opacity:1; transform:translate(0,-20px) rotate(0);} 100%{opacity:0; transform:translate(var(--drift,0px),105vh) rotate(720deg);} }

  .sync-chip { position:fixed; bottom:18px; right:22px; display:flex; align-items:center; gap:10px; padding:9px 16px; border-radius:999px; background:rgba(255,255,255,0.05); border:1px solid var(--card-border); font-size:14px; font-weight:500; color:var(--text-tertiary); z-index:10; }
  .sync-chip .sync-dot { width:8px; height:8px; border-radius:50%; background:#565e70; }
  .sync-chip.ok .sync-dot { background:#30d158; box-shadow:0 0 8px rgba(48,209,88,0.5); }
  .sync-chip.err .sync-dot { background:#ff453a; box-shadow:0 0 8px rgba(255,69,58,0.5); }
  .sync-chip.err { color:#ff8a80; }

  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div class="stage">
  <div class="kpi-card">

    <div class="card-header">
      <div class="title-block">
        <div class="eyebrow">OutReach KPI</div>
        <h1>Quarter Goal</h1>
      </div>
      <div class="chip-row">
        <div class="days-chip">
          <span class="countdown">
            <span class="seg"><b id="cd-days">—</b><span>d</span></span>
            <span class="seg"><b id="cd-hours">—</b><span>h</span></span>
            <span class="seg"><b id="cd-mins">—</b><span>m</span></span>
            <span class="seg"><b id="cd-secs">—</b><span>s</span></span>
          </span>
          <span class="q-label" id="quarter-label"></span>
        </div>
        <div class="month-chip"><span class="dot"></span><span id="month-label">—</span></div>
      </div>
    </div>

    <div class="figures">
      <div>
        <div class="amounts">
          <span class="amount-actual" id="actual-value">SAR 0</span>
          <span class="amount-divider">/</span>
          <span class="amount-target" id="target-value">SAR 0</span>
        </div>
        <div class="amount-label">Quarter achieved · Quarter target</div>
      </div>
      <div class="achievement">
        <div class="pct" id="pct-value">0%</div>
        <div class="pct-label">Achievement</div>
      </div>
    </div>

    <div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
        <span class="bar-pct" id="bar-pct">0%</span>
      </div>
      <div class="progress-meta">
        <span>0%</span>
        <span class="remaining" id="remaining-label"></span>
        <span>100%</span>
      </div>
    </div>

    <div class="milestones-wrap">
      <div class="milestones" id="milestones"></div>
      <div class="next-milestone" id="next-milestone" style="display:none;">
        <svg class="nm-ring" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(245,166,35,0.25)" stroke-width="4"/>
          <circle id="nm-ring-fill" cx="18" cy="18" r="15" fill="none" stroke="#f5a623" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="94.2" transform="rotate(-90 18 18)" style="transition:stroke-dashoffset 1s ease;"/>
        </svg>
        <span>Next: <span class="nm-target" id="nm-target">—</span> <span class="nm-sub" id="nm-sub"></span></span>
      </div>
    </div>

    <!-- FINANCE: top row = July + August monthly; bottom row = Today / This Week / Last Week -->
    <div class="fin-section">
      <div class="fin-row">
        <div class="stat-card month-hi"><div class="stat-label">July Finance</div><div class="stat-value" id="stat-jul">—</div></div>
        <div class="stat-card month-hi"><div class="stat-label">August Finance</div><div class="stat-value" id="stat-aug">—</div></div>
      </div>
      <div class="fin-row">
        <div class="stat-card"><div class="stat-label">Today Finance</div><div class="stat-value" id="stat-24h">—</div></div>
        <div class="stat-card"><div class="stat-label">This Week Finance</div><div class="stat-value" id="stat-thisweek">—</div></div>
        <div class="stat-card"><div class="stat-label">Last Week Finance</div><div class="stat-value" id="stat-week">—</div></div>
      </div>
    </div>

  </div>
</div>

<div class="sync-chip" id="sync-chip" style="display:none;">
  <span class="sync-dot"></span>
  <span id="sync-text">Connecting…</span>
</div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXfxJp-bPlcetEh63C-5lMvUpXvWVvqbcMhOtlh1A9VwVTHIOMmhtyfzMDy6c-xFSTLWJjKQvlM2Th/pub?output=csv";
const SHEET_ID  = "1avRDZt7ez6fd5QCakTy-N_ivWlx0AyFtIkQTvh6r0vA";
const QUARTER_END = "";
const POLL_SECONDS = 30;

let last24h=null, lastweek=null, thisweek=null;
let months = { jun:null, jul:null, aug:null };
let month="July", actual=3853105, target=700000000;

function formatSAR(v){ if(v>=1e9)return "SAR "+trimZero(v/1e9)+"B"; if(v>=1e6)return "SAR "+trimZero(v/1e6)+"M"; if(v>=1e3)return "SAR "+trimZero(v/1e3)+"K"; return "SAR "+v.toLocaleString("en-US"); }
function trimZero(n){ return (Math.round(n*10)/10).toFixed(1).replace(/\.0$/,""); }
function trimZeroPct(v){ return (Math.round(v*10)/10).toFixed(1).replace(/\.0$/,""); }
function statusColors(p){ if(p>=70)return{c:"#30d158",soft:"rgba(48,209,88,0.14)",glow:"rgba(48,209,88,0.35)"}; if(p>=40)return{c:"#f5a623",soft:"rgba(245,166,35,0.14)",glow:"rgba(245,166,35,0.35)"}; return{c:"#ff453a",soft:"rgba(255,69,58,0.14)",glow:"rgba(255,69,58,0.35)"}; }

function animateNumber(el, from, to, dur, fmt){
  const start=performance.now();
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent=fmt(to); return; }
  function frame(now){ const t=Math.min((now-start)/dur,1); const e=1-Math.pow(1-t,4); el.textContent=fmt(from+(to-from)*e); if(t<1)requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
}
function quarterEndDate(now){ if(QUARTER_END){const d=new Date(QUARTER_END+"T23:59:59"); if(!isNaN(d))return d;} const q=Math.floor(now.getMonth()/3); return new Date(now.getFullYear(), q*3+3, 0, 23,59,59); }

function render(){
  const pct = target>0 ? (actual/target)*100 : 0;
  const pctC = Math.max(0, Math.min(pct,100));
  const col = statusColors(pct);
  const root = document.documentElement.style;
  root.setProperty("--status",col.c); root.setProperty("--status-soft",col.soft); root.setProperty("--status-glow",col.glow);

  document.getElementById("month-label").textContent = month;

  const aEl=document.getElementById("actual-value"), pEl=document.getElementById("pct-value");
  document.getElementById("target-value").textContent = formatSAR(target);
  animateNumber(aEl,0,actual,1600,formatSAR);
  animateNumber(pEl,0,pct,1600,v=>trimZeroPct(v)+"%");
  [aEl,pEl].forEach(el=>{ el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); });

  requestAnimationFrame(()=>{
    document.getElementById("progress-fill").style.width = pctC+"%";
    const bp=document.getElementById("bar-pct");
    bp.textContent=trimZeroPct(pct)+"%"; bp.style.left=pctC+"%"; bp.classList.toggle("outside",pctC<12);
  });

  const remaining=Math.max(target-actual,0);
  document.getElementById("remaining-label").innerHTML = remaining>0 ? "<strong>"+formatSAR(remaining)+"</strong>&nbsp;to goal" : "<strong>Goal reached</strong>";

  document.getElementById("stat-24h").textContent    = (last24h!=null&&!isNaN(last24h))?formatSAR(last24h):"—";
  document.getElementById("stat-week").textContent   = (lastweek!=null&&!isNaN(lastweek))?formatSAR(lastweek):"—";
  document.getElementById("stat-thisweek").textContent=(thisweek!=null&&!isNaN(thisweek))?formatSAR(thisweek):"—";
  document.getElementById("stat-jul").textContent    = (months.jul!=null&&!isNaN(months.jul)&&months.jul>0)?formatSAR(months.jul):"—";
  document.getElementById("stat-aug").textContent    = (months.aug!=null&&!isNaN(months.aug)&&months.aug>0)?formatSAR(months.aug):"—";

  updateMilestones(actual);
  document.title="Quarter Goal — "+trimZeroPct(pct)+"%";
  updateDaysLeft();
}

/* ---- milestones: earned badges + NEXT milestone countdown ---- */
const MILESTONE_STEP=50000000; let lastMilestoneCount=-1;
const trophySvg='<svg class="medal-ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 4h12v3a6 6 0 0 1-12 0V4Z" stroke="#30d158" stroke-width="1.8" fill="rgba(48,209,88,0.18)"/><path d="M6 5H3.5v1.5A3 3 0 0 0 6 9.4M18 5h2.5v1.5A3 3 0 0 1 18 9.4" stroke="#30d158" stroke-width="1.8"/><path d="M12 13v3m-3 4h6m-5 0 .6-4h2.8l.6 4" stroke="#30d158" stroke-width="1.8" stroke-linejoin="round"/></svg>';

function updateMilestones(a){
  const count=Math.floor(a/MILESTONE_STEP);
  const row=document.getElementById("milestones");
  let h='<span class="milestones-head">Milestones</span>';
  if(count>0){ for(let i=1;i<=count;i++){ h+='<span class="medal">'+trophySvg+'<span>'+fmtMilestone(i*MILESTONE_STEP)+'</span></span>'; } }
  else { h+='<span class="milestones-head" style="margin:0;opacity:0.7;">None yet</span>'; }
  row.innerHTML=h;

  // NEXT milestone pill
  const nextTarget=(count+1)*MILESTONE_STEP;
  const prev=count*MILESTONE_STEP;
  const toGo=Math.max(nextTarget-a,0);
  const progressToNext=Math.max(0,Math.min((a-prev)/MILESTONE_STEP,1));
  const nm=document.getElementById("next-milestone");
  nm.style.display="inline-flex";
  document.getElementById("nm-target").textContent=fmtMilestone(nextTarget);
  document.getElementById("nm-sub").textContent="· "+formatSAR(toGo)+" to go";
  const C=2*Math.PI*15; // ~94.2
  document.getElementById("nm-ring-fill").setAttribute("stroke-dashoffset", (C*(1-progressToNext)).toFixed(1));

  if(lastMilestoneCount>=0 && count>lastMilestoneCount) launchConfetti();
  lastMilestoneCount=count;
}
function fmtMilestone(v){ return v>=1e9 ? (v/1e9)+"B" : (v/1e6)+"M"; }

function launchConfetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors=["#293BE0","#9139FF","#829DFF","#30d158","#B7B3FF","#ffffff"]; const N=90;
  for(let i=0;i<N;i++){ const p=document.createElement("div"); p.className="confetti-piece";
    p.style.left=Math.random()*100+"vw"; p.style.background=colors[i%colors.length];
    p.style.borderRadius=Math.random()>0.5?"50%":"2px"; p.style.setProperty("--drift",(Math.random()*160-80)+"px");
    const dur=2.6+Math.random()*1.8, delay=Math.random()*0.4;
    p.style.animation="confettiFall "+dur+"s ease-in "+delay+"s forwards";
    p.addEventListener("animationend",()=>p.remove());
    document.body.appendChild(p); setTimeout(()=>p.remove(),(dur+delay)*1000+500);
  }
}

const pad2=n=>String(n).padStart(2,"0");
function updateDaysLeft(){
  const now=new Date(), end=quarterEndDate(now); let ms=Math.max(0,end-now);
  const days=Math.floor(ms/86400000); ms-=days*86400000;
  const hours=Math.floor(ms/3600000); ms-=hours*3600000;
  const mins=Math.floor(ms/60000); ms-=mins*60000;
  const secs=Math.floor(ms/1000);
  document.getElementById("cd-days").textContent=days;
  document.getElementById("cd-hours").textContent=pad2(hours);
  document.getElementById("cd-mins").textContent=pad2(mins);
  document.getElementById("cd-secs").textContent=pad2(secs);
  const q=Math.floor(end.getMonth()/3)+1;
  document.getElementById("quarter-label").textContent="· Q"+q+" ends "+end.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
setInterval(updateDaysLeft,1000);

function resolveSheetUrl(url){ if(!url)return""; if(url.includes("output=csv")||url.includes("tqx=out:csv"))return url; const m=url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/); if(m)return "https://docs.google.com/spreadsheets/d/"+m[1]+"/gviz/tq?tqx=out:csv"; return url; }
const RESOLVED_URL=resolveSheetUrl(SHEET_URL);
let lastSnapshot="";
function setStatus(state,text){ const c=document.getElementById("sync-chip"); if(!RESOLVED_URL&&!SHEET_ID){c.style.display="none";return;} c.style.display="flex"; c.className="sync-chip "+state; document.getElementById("sync-text").textContent=text; }
function parseCsvLine(line){ const out=[]; let cur="",inQ=false; for(const ch of line){ if(ch==='"')inQ=!inQ; else if(ch===","&&!inQ){out.push(cur);cur="";} else cur+=ch; } out.push(cur); return out.map(v=>v.trim()); }
function cleanNumber(v){ return parseFloat(String(v).replace(/[^0-9.]/g,"")); }

function applyValues(nMonth,nActual,nTarget,ex){
  if(isNaN(nActual)||isNaN(nTarget)||nTarget<=0){ setStatus("err","Values in row 2 are not valid numbers"); return; }
  setStatus("ok","Live · synced "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));
  const n24=ex&&!isNaN(ex.last24h)?ex.last24h:null, nW=ex&&!isNaN(ex.lastweek)?ex.lastweek:null, nT=ex&&!isNaN(ex.thisweek)?ex.thisweek:null;
  const mJun=ex&&!isNaN(ex.jun)?ex.jun:null, mJul=ex&&!isNaN(ex.jul)?ex.jul:null, mAug=ex&&!isNaN(ex.aug)?ex.aug:null;
  const snap=[nMonth,nActual,nTarget,n24,nW,nT,mJun,mJul,mAug].join("|");
  if(snap===lastSnapshot) return; lastSnapshot=snap;
  month=nMonth||month; actual=nActual; target=nTarget;
  last24h=n24; lastweek=nW; thisweek=nT; months={jun:mJun,jul:mJul,aug:mAug};
  render();
}

async function fetchCsv(){
  const res=await fetch(RESOLVED_URL+(RESOLVED_URL.includes("?")?"&":"?")+"cb="+Date.now());
  if(!res.ok) throw new Error("HTTP "+res.status);
  const text=await res.text(); if(text.trim().startsWith("<")) throw new Error("not csv");
  const lines=text.trim().split(/\r?\n/); if(lines.length<2){ setStatus("err","Sheet has no data row — add values in row 2"); return true; }
  const headers=parseCsvLine(lines[0]).map(h=>h.toLowerCase()); const values=parseCsvLine(lines[1]); const row={};
  headers.forEach((h,i)=>row[h]=values[i]);
  if(!("actual" in row)||!("target" in row)){ setStatus("err","Headers must be: month, actual, target (row 1)"); return true; }
  applyValues(row.month,cleanNumber(row.actual),cleanNumber(row.target),{ last24h:cleanNumber(row.last24h), lastweek:cleanNumber(row.lastweek), thisweek:cleanNumber(row.thisweek), jun:cleanNumber(row.jun), jul:cleanNumber(row.jul), aug:cleanNumber(row.aug) });
  return true;
}
function fetchJsonp(){
  return new Promise((resolve,reject)=>{
    if(!SHEET_ID){reject(new Error("no id"));return;}
    const cb="gvizCb_"+Date.now(); const s=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("timeout"));},10000);
    function cleanup(){clearTimeout(timer);delete window[cb];s.remove();}
    window[cb]=(data)=>{ cleanup(); try{
      const cols=data.table.cols.map(c=>(c.label||"").toLowerCase().trim()); const cells=data.table.rows[0].c; const row={};
      cols.forEach((h,i)=>row[h]=cells[i]?cells[i].v:null);
      if(!("actual" in row)||!("target" in row)){ setStatus("err","Headers must be: month, actual, target (row 1)"); resolve(true); return; }
      applyValues(String(row.month??""),cleanNumber(row.actual),cleanNumber(row.target),{ last24h:cleanNumber(row.last24h), lastweek:cleanNumber(row.lastweek), thisweek:cleanNumber(row.thisweek), jun:cleanNumber(row.jun), jul:cleanNumber(row.jul), aug:cleanNumber(row.aug) });
      resolve(true);
    }catch(e){reject(e);} };
    s.onerror=()=>{cleanup();reject(new Error("script load failed"));};
    s.src="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json;responseHandler:"+cb+"&headers=1&cb="+Date.now();
    document.head.appendChild(s);
  });
}
async function fetchRemote(){
  if(!RESOLVED_URL&&!SHEET_ID) return;
  try{ if(RESOLVED_URL){ await fetchCsv(); return; } throw new Error("no url"); }
  catch(e1){ try{ await fetchJsonp(); } catch(e2){ setStatus("err","Can't reach the sheet — check internet, and set Share to 'Anyone with the link' (Viewer)"); console.warn(e1,e2); } }
}

render();
setStatus("","Connecting…");
fetchRemote();
if(RESOLVED_URL||SHEET_ID) setInterval(fetchRemote, POLL_SECONDS*1000);
