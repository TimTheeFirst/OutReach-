<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financing Solutions Department</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Manafa brand · portrait TV (1080×1920 / rotated 1920×1080)
     ============================================================ */
  :root {
    --bg-top: #4a56dd;
    --bg-mid: #3a41c4;
    --bg-low: #35309f;
    --text: #ffffff;
    --text-soft: #d9defc;
    --text-dim: #b7bdf0;
    --glowline: #eef2ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: "Cairo", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    overflow: hidden;
    background: var(--bg-mid);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(90% 55% at 50% -12%, rgba(199, 226, 255, 0.25), transparent 60%),
      radial-gradient(120% 70% at 85% 108%, rgba(145, 57, 255, 0.35), transparent 60%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-low) 100%);
    z-index: -2;
  }

  /* faint brand arcs, bottom-left */
  .brand-arcs {
    position: fixed;
    bottom: -12vh;
    left: -14vw;
    width: 70vw;
    max-width: 720px;
    opacity: 0.14;
    z-index: -1;
    pointer-events: none;
  }

  .poster {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 5.5vh 6vw 3.5vh;
  }

  /* --- header --- */
  .kpi-tag {
    font-size: clamp(22px, 2.6vh, 40px);
    font-weight: 800;
    letter-spacing: 0.12em;
  }
  .kpi-tag-ar {
    font-size: clamp(22px, 2.7vh, 42px);
    font-weight: 700;
    color: var(--text-soft);
    margin-top: 0.2vh;
  }
  .countdown-line {
    margin-top: 1.4vh;
    font-size: clamp(14px, 1.5vh, 22px);
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }

  /* --- headline --- */
  .headline {
    margin-top: 4.5vh;
    font-size: clamp(34px, 4.6vh, 68px);
    font-weight: 800;
    line-height: 1.15;
    max-width: 22ch;
    text-shadow: 0 2px 24px rgba(20, 24, 90, 0.35);
  }

  /* --- big figure --- */
  .figure {
    margin-top: 4.5vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.6vh;
  }
  .figure .riyal { height: clamp(40px, 5.2vh, 78px); width: auto; opacity: 0.95; }
  .figure .num {
    font-size: clamp(64px, 8.8vh, 132px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #ffffff 55%, #c3cbff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 30px rgba(255, 255, 255, 0.25));
  }
  .figure-label {
    margin-top: 1vh;
    font-size: clamp(24px, 3vh, 44px);
    font-weight: 700;
    color: var(--text-soft);
  }

  .pulse { animation: pulse 0.8s ease; }
  @keyframes pulse {
    0% { transform: scale(1); } 35% { transform: scale(1.04); } 100% { transform: scale(1); }
  }

  /* --- journey --- */
  .journey {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 30vh;
    margin-top: 1vh;
  }
  .journey svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  .path-label {
    font-family: "Cairo", sans-serif;
    font-weight: 800;
    fill: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .path-label.dim { fill: var(--text-soft); font-weight: 700; }

  /* --- footer --- */
  .motivation {
    font-size: clamp(22px, 2.7vh, 40px);
    font-weight: 800;
  }
  .motivation-ar {
    font-size: clamp(22px, 2.8vh, 42px);
    font-weight: 700;
    color: var(--text-soft);
    margin-top: 0.4vh;
  }
  .dept {
    margin-top: 3.2vh;
    line-height: 1.5;
  }
  .dept .ar {
    font-size: clamp(16px, 1.9vh, 28px);
    font-weight: 700;
    color: var(--text-dim);
  }
  .dept .en {
    font-size: clamp(14px, 1.7vh, 25px);
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  /* sync chip — small and quiet */
  .sync-chip {
    position: fixed;
    bottom: 14px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(10, 12, 60, 0.28);
    border: 1px solid rgba(255,255,255,0.14);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    z-index: 10;
  }
  .sync-chip .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #b7bdf0; }
  .sync-chip.ok .sync-dot { background: #30d158; box-shadow: 0 0 8px rgba(48,209,88,0.6); }
  .sync-chip.err .sync-dot { background: #ff6a5e; box-shadow: 0 0 8px rgba(255,106,94,0.6); }
  .sync-chip.err { color: #ffd2cd; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<svg class="brand-arcs" viewBox="0 0 720 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="330" cy="330" r="190"/>
    <circle cx="430" cy="260" r="150"/>
    <path d="M180 470 L 470 180"/>
  </g>
</svg>

<!-- Saudi Riyal symbol (simplified official mark) -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="riyal-sign" viewBox="0 0 100 100">
    <g stroke="currentColor" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M38 12 V 58 Q38 76 20 82"/>
      <path d="M58 6 V 68"/>
      <path d="M14 52 L 88 38"/>
      <path d="M14 70 L 88 56"/>
    </g>
  </symbol>
</svg>

<div class="poster">

  <div>
    <div class="kpi-tag" id="q-tag">Q3 KPI</div>
    <div class="kpi-tag-ar" id="q-tag-ar">هدف الربع الثالث</div>
    <div class="countdown-line" id="countdown-line">— left in Q3</div>
  </div>

  <div class="headline" id="headline">We're Off to a Great Start!</div>

  <div>
    <div class="figure">
      <svg class="riyal" style="color:#dfe5ff" viewBox="0 0 100 100" width="70" height="70"><use href="#riyal-sign"/></svg>
      <span class="num" id="actual-value">0</span>
    </div>
    <div class="figure-label">Financing Achieved</div>
  </div>

  <div class="journey">
    <svg viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="10" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-soft" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="18" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="target-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- journey path -->
      <path id="journey-path"
        d="M -40 640 C 200 560, 260 470, 420 420 S 700 330, 810 170"
        stroke="var(--glowline)" stroke-width="10" stroke-linecap="round"
        fill="none" filter="url(#glow)"/>

      <!-- target (bullseye + arrow) at path end -->
      <g id="target-group" transform="translate(810,170)">
        <circle r="86" fill="url(#target-glow)"/>
        <circle r="52" fill="#1c1f66" stroke="#ffffff" stroke-width="6"/>
        <circle r="34" fill="#ffffff"/>
        <circle r="20" fill="#1c1f66"/>
        <circle r="8"  fill="#ffffff"/>
        <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
          <line x1="0" y1="0" x2="52" y2="-52"/>
          <path d="M52 -52 L30 -50 M52 -52 L50 -30" fill="none"/>
        </g>
      </g>
      <text id="target-label" class="path-label dim" font-size="34" text-anchor="middle" x="810" y="292">
        <tspan id="target-text">⃀ 650M</tspan>
      </text>

      <!-- progress star -->
      <g id="star-group" filter="url(#glow-soft)">
        <path id="star-shape" fill="#ffffff"
          d="M0 -34 C6 -12, 12 -6, 34 0 C12 6, 6 12, 0 34 C-6 12, -12 6, -34 0 C-12 -6, -6 -12, 0 -34 Z"/>
      </g>
      <text id="star-label" class="path-label" font-size="36" text-anchor="middle" y="0">
        <tspan id="star-text">⃀ 16.25M</tspan>
      </text>
    </svg>
  </div>

  <div>
    <div class="motivation">Let's keep moving forward</div>
    <div class="motivation-ar">!كل إنجاز يقود إلى إنجاز أكبر</div>
    <div class="dept">
      <div class="ar">قسم الحلول التمويلية</div>
      <div class="en">Financing Solutions Department</div>
    </div>
  </div>

</div>

<div class="sync-chip" id="sync-chip" style="display:none;">
  <span class="sync-dot"></span>
  <span id="sync-text">Connecting…</span>
</div>

<script>
/* ==============================================================
   CONFIGURATION
   ============================================================== */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRME1J-Gj81Ias1yImSZkXYlvYiMXABYNTwsTi6AAnat8Qly-6bGzrFZm8vn61R5iCvU0Rdm9oh9nKm/pub?output=csv";
const SHEET_ID = "";        // optional: ID from the sheet's normal /edit link (backup connection)
const QUARTER_END = "";     // optional override e.g. "2026-09-30"
const POLL_SECONDS = 30;

let month  = "July";        // fallback values (used until the sheet connects)
let actual = 16250000;
let target = 650000000;
/* ============================================================== */

const AR_ORDINALS = { 1: "الأول", 2: "الثاني", 3: "الثالث", 4: "الرابع" };

function fmtM(value) {
  if (value >= 1e9) return trim2(value / 1e9) + "B";
  if (value >= 1e6) return trim2(value / 1e6) + "M";
  if (value >= 1e3) return trim2(value / 1e3) + "K";
  return String(Math.round(value));
}
function trim2(n) { return (Math.round(n * 100) / 100).toFixed(2).replace(/\.?0+$/, ""); }

function headlineFor(p) {
  if (p >= 1)    return "Goal Achieved — Outstanding!";
  if (p >= 0.75) return "The Goal Is Within Reach!";
  if (p >= 0.5)  return "More Than Halfway There!";
  if (p >= 0.25) return "Great Momentum — Keep Going!";
  return "We're Off to a Great Start!";
}

function animateNumber(el, from, to, duration, formatter) {
  const start = performance.now();
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = formatter(to); return; }
  function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 4);
    el.textContent = formatter(from + (to - from) * eased);
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function render() {
  const progress = target > 0 ? Math.max(0, Math.min(actual / target, 1)) : 0;

  // headline + big number
  document.getElementById("headline").textContent = headlineFor(progress);
  const numEl = document.getElementById("actual-value");
  animateNumber(numEl, 0, actual, 1500, fmtM);
  numEl.classList.remove("pulse"); void numEl.offsetWidth; numEl.classList.add("pulse");

  // labels on the journey
  document.getElementById("star-text").textContent   = "⃀ " + fmtM(actual);
  document.getElementById("target-text").textContent = "⃀ " + fmtM(target);

  // star position along the path (small head start so the journey
  // always reads as "underway"; reaches the target exactly at 100%)
  const path = document.getElementById("journey-path");
  const L = path.getTotalLength();
  const visual = 0.12 + 0.88 * progress;
  const pt = path.getPointAtLength(L * Math.min(visual, 0.93)); // stop just before the bullseye
  const star = document.getElementById("star-group");
  star.setAttribute("transform", "translate(" + pt.x + "," + pt.y + ")");
  const label = document.getElementById("star-label");
  label.setAttribute("x", pt.x);
  label.setAttribute("y", pt.y + 78);

  document.title = "Financing Solutions — " + month;
}

/* ---- quarter tag + countdown ---- */
function quarterEndDate(now) {
  if (QUARTER_END) { const d = new Date(QUARTER_END + "T23:59:59"); if (!isNaN(d)) return d; }
  const q = Math.floor(now.getMonth() / 3);
  return new Date(now.getFullYear(), q * 3 + 3, 0, 23, 59, 59);
}
const pad2 = n => String(n).padStart(2, "0");
function updateCountdown() {
  const now = new Date();
  const end = quarterEndDate(now);
  const q = Math.floor(end.getMonth() / 3) + 1;
  document.getElementById("q-tag").textContent = "Q" + q + " KPI";
  document.getElementById("q-tag-ar").textContent = "هدف الربع " + (AR_ORDINALS[q] || q);

  let ms = Math.max(0, end - now);
  const days = Math.floor(ms / 86400000); ms -= days * 86400000;
  const hours = Math.floor(ms / 3600000); ms -= hours * 3600000;
  const mins = Math.floor(ms / 60000); ms -= mins * 60000;
  const secs = Math.floor(ms / 1000);
  document.getElementById("countdown-line").textContent =
    days + "d " + pad2(hours) + "h " + pad2(mins) + "m " + pad2(secs) + "s left in Q" + q;
}
setInterval(updateCountdown, 1000);

/* ---- remote sync: CSV first, JSONP backup ---- */
let lastSnapshot = "";

function setStatus(state, text) {
  const chip = document.getElementById("sync-chip");
  chip.style.display = "flex";
  chip.className = "sync-chip " + state;
  document.getElementById("sync-text").textContent = text;
}

function cleanNumber(v) { return parseFloat(String(v).replace(/[^0-9.]/g, "")); }

function parseCsvLine(line) {
  const out = []; let cur = ""; let inQ = false;
  for (const ch of line) {
    if (ch === '"') inQ = !inQ;
    else if (ch === "," && !inQ) { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(v => v.trim());
}

function applyValues(newMonth, newActual, newTarget) {
  if (isNaN(newActual) || isNaN(newTarget) || newTarget <= 0) {
    setStatus("err", "Values in row 2 are not valid numbers"); return;
  }
  setStatus("ok", "Live · " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}));
  const snapshot = [newMonth, newActual, newTarget].join("|");
  if (snapshot === lastSnapshot) return;
  lastSnapshot = snapshot;
  month = newMonth || month; actual = newActual; target = newTarget;
  render();
}

async function fetchCsv() {
  const res = await fetch(SHEET_URL + (SHEET_URL.includes("?") ? "&" : "?") + "cb=" + Date.now());
  if (!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  if (text.trim().startsWith("<")) throw new Error("not csv");
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) { setStatus("err", "Sheet has no data row — add values in row 2"); return; }
  const headers = parseCsvLine(lines[0]).map(h => h.toLowerCase());
  const values = parseCsvLine(lines[1]);
  const row = {};
  headers.forEach((h, i) => row[h] = values[i]);
  if (!("actual" in row) || !("target" in row)) {
    setStatus("err", "Headers must be: month, actual, target (row 1)"); return;
  }
  applyValues(row.month, cleanNumber(row.actual), cleanNumber(row.target));
}

function fetchJsonp() {
  return new Promise((resolve, reject) => {
    if (!SHEET_ID) { reject(new Error("no sheet id")); return; }
    const cbName = "gvizCb_" + Date.now();
    const script = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 10000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = (data) => {
      cleanup();
      try {
        const cols = data.table.cols.map(c => (c.label || "").toLowerCase().trim());
        const cells = data.table.rows[0].c;
        const row = {};
        cols.forEach((h, i) => row[h] = cells[i] ? cells[i].v : null);
        if (!("actual" in row) || !("target" in row)) {
          setStatus("err", "Headers must be: month, actual, target (row 1)"); resolve(); return;
        }
        applyValues(String(row.month ?? ""), cleanNumber(row.actual), cleanNumber(row.target));
        resolve();
      } catch (e) { reject(e); }
    };
    script.onerror = () => { cleanup(); reject(new Error("script load failed")); };
    script.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
                 "/gviz/tq?tqx=out:json;responseHandler:" + cbName + "&headers=1&cb=" + Date.now();
    document.head.appendChild(script);
  });
}

async function fetchRemote() {
  try { await fetchCsv(); return; }
  catch (e1) {
    try { await fetchJsonp(); }
    catch (e2) {
      setStatus("err", SHEET_ID
        ? "Can't reach the sheet — check internet and sharing"
        : "Can't reach the sheet — open via the GitHub link, or add SHEET_ID");
      console.warn("CSV failed:", e1, "JSONP failed:", e2);
    }
  }
}

/* riyal symbol fallback: if the ⃀ character isn't supported by the
   device's fonts, swap the text labels to "SAR" */
function riyalFallback() {
  const test = document.createElement("span");
  test.style.cssText = "position:absolute;visibility:hidden;font-size:40px;";
  test.textContent = "⃀";
  document.body.appendChild(test);
  const w1 = test.offsetWidth;
  test.textContent = "\uFFFF"; // guaranteed .notdef
  const w2 = test.offsetWidth;
  test.remove();
  if (w1 === w2) { // tofu — replace with SAR
    document.querySelectorAll("#star-text, #target-text").forEach(el => {
      el.textContent = el.textContent.replace("⃀", "SAR");
    });
    window.__riyalUnsupported = true;
  }
}

render();
updateCountdown();
riyalFallback();
setStatus("", "Connecting…");
fetchRemote();
setInterval(fetchRemote, POLL_SECONDS * 1000);
</script>

</body>
</html>
